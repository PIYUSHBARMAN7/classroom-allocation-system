# Accept connections from Render
server.address=0.0.0.0
server.port=${PORT:8080}

# Recognise HTTPS forwarded by Render
server.forward-headers-strategy=native

# Protect production session cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Use the deployed website for password-reset links
app.frontend-base-url=${FRONTEND_BASE_URL:${RENDER_EXTERNAL_URL}}

# Production uses Brevo HTTPS instead of SMTP
app.mail.provider=brevo
app.mail.brevo-api-key=${BREVO_API_KEY}

# Disable SMTP auto-configuration in production
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration